# Alfa-Bank (web.alfabank.ru) — read-only profile, checked against the live
# cabinet on 2026-10-24 for a desktop Chrome session.
#
# Two pages: the dashboard holds the product balances, /history/ holds the
# operations. Only the already rendered page is read: the collector does not
# scroll, does not press "Скачать выписку" and does not paginate, so
# transactions contain what the first screen of /history/ shows.
bank: alfa
status: verified
notes: >-
  Checked on 2026-10-24 against a desktop Chrome session: the dashboard and the first page of
  /history/ only (no scrolling, no pagination, no statement download). The "common balance"
  widget is not the sum of the product cards, so the profile reads the cards and ignores it.
url: "https://web.alfabank.ru/dashboard/"
wait_for: "[data-test-id=common-balance-button]"

balances:
  - row: "section[data-test-id^=product-view-component-]:has([data-test-id=product-view-amount])"
    fields:
      product:
        selector: "p"
      amount:
        selector: "[data-test-id=product-view-amount]"

transactions:
  - url: "https://web.alfabank.ru/history/"
    wait_for: "[data-test-id=operation-cell]"
    row: "div:has(> [data-date]):has(> button[data-test-id=operation-cell])"
    fields:
      date:
        selector: "[data-date]"
        attr: "data-date"
    items:
      row: "button[data-test-id=operation-cell]"
      fields:
        title:
          selector: "[data-test-id=title-text_content]"
        category:
          selector: "[data-test-id=transaction-category-name]"
        amount:
          selector: "[data-test-id=transaction-status]"
