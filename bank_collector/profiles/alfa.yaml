# Alfa-Bank (web.alfabank.ru) — read-only profile, checked against the live
# cabinet on 2026-10-24 for a desktop Chrome session.
#
# Two pages: the dashboard holds the product balances, /history/ holds the
# operations. The already rendered page is read — and the history list is
# scrolled so that the operations the cabinet appends while it is scrolled are
# read as well (down to stop_before_date). Scrolling only moves the viewport.
# The one click besides the code screen is the list's own «Показать ещё»
# button (owner-approved 2026-10-26): it is pressed only when scrolling added
# nothing, the load_more_scope selector names exactly one list container that
# holds operation cells, and exactly one button inside it carries that whole
# text — it only asks the list to append its next rows. "Скачать выписку" is
# never pressed, no statement is downloaded and no request of our own is sent.
#
# LIVE CHECK (2026-10-26): the load-more click and its scope selector were
# verified against the live cabinet — one click appended 40 operations back to
# 2025-11-01, the scrolling stopped at "date" and the run reported
# complete: true. Everything else below (the dashboard, the /history/
# operations, the read-only scrolling) was checked live on 2026-10-24, which
# is what status: verified refers to.
bank: alfa
status: verified
notes: "Checked on 2026-10-24 against a desktop Chrome session: the dashboard and the operations list of /history/, which is scrolled (read-only) down to the date in scroll.stop_before_date. LIVE CHECK (2026-10-26): the list's «Показать ещё» click and its load_more_scope selector were verified against the live cabinet — one click appended 40 operations back to 2025-11-01, the scrolling stopped at 'date' and the run reported complete: true. The click only ever happens inside the one container the scope names, only when exactly one <button> there carries that whole text, and it only appends rows of the list. No statement is downloaded and no request of our own is sent. The 'common balance' widget is not the sum of the product cards, so the profile reads the cards and ignores it."
url: "https://web.alfabank.ru/dashboard/"
wait_for: "[data-test-id=common-balance-button]"

balances:
  - row: "section[data-test-id^=product-view-component-]:has([data-test-id=product-view-amount])"
    fields:
      product:
        selector: "p"
      amount:
        selector: "[data-test-id=product-view-amount]"

transactions:
  - url: "https://web.alfabank.ru/history/"
    wait_for: "[data-test-id=operation-cell]"
    row: "div:has(> [data-date]):has(> button[data-test-id=operation-cell])"
    fields:
      date:
        selector: "[data-date]"
        attr: "data-date"
    items:
      row: "button[data-test-id=operation-cell]"
      fields:
        title:
          selector: "[data-test-id=title-text_content]"
        category:
          selector: "[data-test-id=transaction-category-name]"
        amount:
          selector: "[data-test-id=transaction-status]"
    # The history list shows 20 operations per screen, appends the next ones
    # while it is scrolled and then offers a «Показать ещё» button. Scrolling
    # is read-only; once a scroll round adds nothing, that one button may be
    # pressed — the only click besides the code screen, approved by the owner
    # on 2026-10-26 — and it only appends rows of the list. The button is
    # searched ONLY inside the container named by load_more_scope (the list
    # whose direct child is the untagged load-more button and which holds the
    # operation cells), so a same-label control of an offers block can never
    # be pressed. Scope and click were verified against the live cabinet on
    # 2026-10-26: one click appended 40 operations back to 2025-11-01, the run
    # stopped at "date" and reported complete: true. A slow cabinet gets about
    # 7 s (6 empty rounds x 1.2 s) to append rows before the list counts as
    # finished; stopping short of stop_before_date is a warning.
    scroll:
      max_rounds: 200
      step_px: 1200
      settle_ms: 1200
      stop_after_empty_rounds: 6
      stop_before_date: "2026-01-01"
      load_more_text: "Показать ещё"
      load_more_scope: "div:has(> button:not([data-test-id])):has(button[data-test-id=operation-cell])"
      max_clicks: 100

# The cabinet's static "secret code" screen (NOT an SMS code): after a long
# absence Alfa asks for the permanent cabinet code it already knows. The
# selectors below were taken from the live screen on 2026-10-24
# (private.auth.alfabank.ru/passport/cerberus-mini/dashboard/pincode). The
# end-to-end entry was first observed in the scheduled devicex2 run of
# 2026-10-28 03:03Z: the screen appeared, the code was entered, the dashboard
# opened and the report was written (exit 0).
# The section is used solely by `bank-collector --enter-code`; the code itself
# lives in the file named by `code_file` (mode 0600, outside the repository).
unlock:
  markers: ["секретный код"]
  submit_text: ["Вперёд"]
  # The live screen (2026-10-24) has exactly one password field inside this
  # form.  The selector avoids spaces inside the quotes on purpose: the
  # stdlib test doubles split selectors on whitespace.
  input_selector: 'form[class*="pincode-browser_form"] input[type="password"]'
  success_wait: "[data-test-id=common-balance-button]"
  code_file: "~/.config/bank-collector/alfa-code"
  max_attempts: 1
  min_attempts_left: 3
  # Verified end to end in the scheduled run of 2026-10-28 03:03Z (code
  # entered, dashboard opened, report written, exit 0).
  status: verified
